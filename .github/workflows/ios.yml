name: iOS build
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build simulator app
        run: xcodebuild -project ChanganLink.xcodeproj -scheme ChanganLink -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone package for development signing
        run: |
          xcodebuild -project ChanganLink.xcodeproj -scheme ChanganLink -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/device" CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/device/Build/Products/Release-iphoneos/ChanganLink.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/ChanganLink-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ChanganLink-unsigned
          path: ${{ runner.temp }}/ChanganLink-unsigned.ipa
          if-no-files-found: error
