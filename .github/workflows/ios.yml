name: iOS build
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        configuration: [Personal, Release]
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile Carlink protocol for iOS
        run: bash Native/build.sh
      - name: Check Carlink authentication and media protocols
        if: matrix.configuration == 'Personal'
        run: cargo test --manifest-path vendor/stream/rust/Cargo.toml -p oxp-clink --test auth --test codecs
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Test screen receiver
        run: |
          swiftc Broadcast/MirrorServer.swift Tests/main.swift -o "$RUNNER_TEMP/receiver-test"
          "$RUNNER_TEMP/receiver-test"
      - name: Build simulator app
        run: xcodebuild -project ChanganLink.xcodeproj -scheme ChanganLink -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone package for development signing
        run: |
          xcodebuild -project ChanganLink.xcodeproj -scheme ChanganLink -configuration ${{ matrix.configuration }} -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/device" CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/device/Build/Products/${{ matrix.configuration }}-iphoneos/ChanganLink.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/ChanganLink-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ChanganLink-${{ matrix.configuration }}-unsigned
          path: ${{ runner.temp }}/ChanganLink-unsigned.ipa
          if-no-files-found: error
